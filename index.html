<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Palette de Pokémon</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">

<style>
:root{
  --bg:#f2f2f2;
  --card:#ffffff;
  --txt:#1a1a1a;
  --accent:#6e6e6e;
  --border:#d1d1d1;
  --on-accent:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
html,body{margin:0;padding:0;overscroll-behavior-y:none;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:520px;margin:0 auto;min-height:100vh}

header{position:sticky;top:0;z-index:15;background:var(--bg);padding:12px 12px 8px}
.title{display:flex;align-items:center;gap:9px;margin:0 0 10px;padding-right:43px;min-height:34px}
#hlogo,#htitle{cursor:pointer}
.title img{width:24px;height:24px;object-fit:contain}
.title h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.searchwrap{position:relative;margin:0;height:0;overflow:hidden;transition:height .25s ease,margin .25s ease}
.searchwrap.open{height:34px;margin:0 0 10px}
.searchRow{position:relative;height:34px}


.searchIcon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.searchIcon svg{width:16px;height:16px}
.searchIcon svg circle,.searchIcon svg line{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.search{width:100%;padding:9px 38px 9px 36px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:14px;outline:none;height:34px;box-sizing:border-box;transition:border-color .3s ease}
.search:focus{border-color:var(--accent)}
.qclear{position:absolute;right:8px;top:50%;width:22px;height:22px;padding:0;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transform:translateY(-50%)}
.qclear svg{width:15px;height:15px}
.qclear svg path{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round}
.search::placeholder{color:var(--accent);opacity:.7}

.stripwrap{display:flex;align-items:stretch;padding:0}
.stripArrow{flex:0 0 20px;width:20px;height:46px;align-self:flex-start;border:none;border-radius:10px;background:var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:height .2s ease}
.stripArrow svg{width:8px;height:14px;display:block}
.stripArrow polygon{fill:#000}
.stripArrow.left{margin-right:8px}
.stripArrow.right{margin-left:8px}
.stripArrow:active{background:var(--bg)}
.stripClip{flex:1;min-width:0;position:relative;background:var(--bg)}
.strip{display:flex;align-items:flex-start;gap:6px;overflow-x:auto;padding:0 2px;scroll-behavior:smooth}
.strip::-webkit-scrollbar{height:0}
.sitmCol{display:flex;flex-direction:column;flex:0 0 auto;width:46px}
.sitm{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s ease,transform .1s ease}
.sitmImgWrap{position:relative;overflow:hidden;width:78%;height:78%}
.sitmImgWrap .simg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:block}
.sitm.active{border-color:var(--accent);border-width:1.5px}
.sitm:active{transform:scale(.94)}
.sitm.multi::after{content:'';position:absolute;left:50%;bottom:3px;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--accent)}

.stripExpand{display:flex;gap:6px;margin-top:6px}
.stripExpand .sitm.base-mark{border-color:var(--accent);border-width:1.5px}
.stripExpand .sitm.base-mark{opacity:0;transform:translateY(-8px);transition:opacity .15s ease,transform .15s ease}
.stripExpand.show .sitm.base-mark{opacity:1;transform:translateY(0)}
.stripExpand .sitm:not(.base-mark){opacity:0;transition:opacity .2s ease .13s,transform .24s ease .13s}
.stripExpand.show .sitm:not(.base-mark){opacity:1}

.plist{display:flex;flex-direction:column;gap:10px;padding:2px 12px 0}
.prow{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:16px}
.prow[data-multi="1"]{touch-action:pan-y}
.pinner{position:relative;width:100%}
.pcontent{display:flex;flex-direction:column;gap:8px;padding:14px;width:100%;box-sizing:border-box;background:var(--card);height:226px;overflow:hidden}
.ptop{display:flex;align-items:baseline;gap:6px;padding-right:56px}
.ptop .pno{font-size:11px;color:var(--accent);font-weight:700;flex:0 0 auto}
.ptop .pname{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pbody{display:flex;gap:14px;min-width:0}
.pleft{flex:0 0 176px;display:flex;align-items:center;justify-content:center}
.pleft img{width:168px;height:168px;object-fit:contain;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
.pright{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.pr-line{display:flex;align-items:baseline;gap:10px;font-size:12.5px;min-width:0}
.pr-line .v{font-weight:600}
.pr-line .k{color:var(--accent);font-weight:600;flex:0 0 auto}
.pr-hw{gap:0;font-size:11.5px}
.pr-hw .hcol{flex:0 0 50%;display:flex;gap:3px;align-items:baseline;min-width:0}
.pr-hw .hcol .v{white-space:nowrap}
.typebadges{display:flex;gap:6px;flex-wrap:wrap}
.typebadge{display:inline-flex;align-items:center;justify-content:center;width:56.5px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:700;color:#fff}
.palette{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.paletterow{display:flex;gap:5px}
.paletterow .swatchbar{flex:1;min-width:0}
.swatchbar{width:100%;min-height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;font-family:monospace;letter-spacing:.4px}
.pal6 .swatchbar{font-size:9px;letter-spacing:.2px}
.swatchbar.empty{background:var(--bg)!important;border:1px dashed var(--border);color:transparent!important}
.pquizmark{position:absolute;top:11px;right:12px;width:20px;height:20px;z-index:2;pointer-events:none}
.pquizmark svg{width:100%;height:100%;display:block}
.pquizmark circle{fill:none;stroke:var(--border);stroke-width:7}
.pquizmark.solved circle{fill:var(--accent);stroke:var(--accent)}
.brushbtn{position:absolute;top:11px;right:38px;width:20px;height:20px;z-index:2;padding:0;margin:0;border:none;background:none;cursor:pointer;display:block;touch-action:manipulation}
.brushbtn svg{width:100%;height:100%;display:block}
.brushbtn:active{opacity:.7}

/* ---- 퀴즈 모드 ---- */
#homeBtn svg rect{fill:var(--accent)}
body.quizmode header{display:none}
body.quizmode #searchToggleBtn{opacity:.35;pointer-events:none}
body.quizmode .plist:not(#quizArea),body.quizmode #emptyMsg,body.quizmode .sitefooter{display:none}
#quizArea{padding:58px 12px 0}
.quizcontent{height:auto;padding-bottom:16px}
.quiztop{padding-right:60px}
.quiztop .pname{font-size:13.5px;font-weight:700;color:var(--txt)}
.quizleft{display:flex;align-items:center}
.quizleft .palette{width:100%}
.quizdesc{font-size:13px;line-height:1.5;color:var(--txt);font-weight:600}
.quizhintline{font-size:11.5px;color:var(--accent);font-weight:600;min-height:15px;margin-top:6px}
.quizanswer-row{display:flex;gap:8px;align-items:center;margin-top:10px;padding-top:12px;border-top:1px solid var(--border)}
.quizinput-wrap{flex:1;position:relative;display:flex;align-items:center;min-width:0}
.quizinput-wrap input{width:100%;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font-size:13px;padding:0 34px 0 12px;box-sizing:border-box;outline:none;font-family:inherit}
.quizinput-wrap button{position:absolute;right:6px;width:20px;height:20px;border:none;background:none;cursor:pointer;padding:0;color:var(--accent)}
.quizinput-wrap button svg{width:100%;height:100%;display:block}
.quizhintbtn{flex:0 0 auto;height:36px;padding:0 14px;border:none;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.quizhintbtn:disabled{opacity:.4;cursor:default}
.quizfeedback{font-size:12.5px;font-weight:700;min-height:16px;margin-top:8px}
.quizfeedback.correct{color:#3a8f5c}
.quizfeedback.wrong{color:#c0392b}
.quizpawbadge{position:absolute;top:14px;right:14px;width:40px;height:40px;z-index:2;pointer-events:none}
.quizpawbadge svg{width:100%;height:100%;display:block}
.quizpawbadge circle{stroke-width:7;transition:fill .25s ease,stroke .25s ease}
.quizpawbadge.hint0 circle{fill:#D4AF37;stroke:#D4AF37}
.quizpawbadge.hint1 circle{fill:#B8B8B8;stroke:#B8B8B8}
.quizpawbadge.hint2 circle{fill:#CD7F32;stroke:#CD7F32}
.quizpawbadge.hint3 circle{fill:#79B84C;stroke:#79B84C}
.quizpalstack{position:relative;width:100%}
.qpalette{display:flex;flex-direction:column;gap:5px;width:100%;transition:opacity .4s ease}
.qpalette.gone{opacity:0}
.qpslot{display:flex;flex-direction:column;width:100%}
.qpbar{width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:monospace;letter-spacing:.2px;border-radius:5px;transition:height .5s ease,opacity .4s ease;box-sizing:border-box}
.qpbar .qphex{white-space:nowrap}
.quizmosaic{display:none;width:100%;aspect-ratio:1/1;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(12,1fr);border-radius:8px;overflow:hidden;opacity:0;transition:opacity .45s ease}
.quizmosaic.show{display:grid}
.quizmosaic.in{opacity:1}
.qmcell{width:100%;height:100%}

@media (max-width:380px){
  .pcontent{height:210px}
  .pbody{gap:10px}
  .pleft{flex:0 0 138px}
  .pleft img{width:130px;height:130px}
  .pr-line{font-size:11.5px}
  .pr-hw{font-size:10px}
  .pr-hw .hcol{gap:2px}
}

.empty{text-align:center;color:var(--accent);padding:50px 20px;font-size:13px}
.sitefooter{font-size:7.5px;color:var(--accent);text-align:left;line-height:1.5;padding:12px}

#menubtnWrap{position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:33;display:flex;align-items:center;justify-content:flex-end;pointer-events:none}
.hicon-btn{position:relative;margin-top:12px;margin-right:2px;width:34px;height:34px;padding:0;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;flex-shrink:0}
.hicon-btn svg{width:24px;height:24px;display:block}
#quizBtn svg circle{fill:var(--accent)}
#searchToggleBtn svg circle,#searchToggleBtn svg line{stroke:var(--accent);stroke-width:2.8;stroke-linecap:round;fill:none}

#menubtnWrap.menuopen .hicon-btn{display:none}
#menubtn{position:relative;margin-top:13px;margin-right:14px;width:34px;height:34px;padding:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;pointer-events:auto;flex-shrink:0}
#menubtn span{display:block;width:19px;height:3px;border-radius:2px;background:var(--accent);transform-origin:center;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .2s ease}
#menubtn.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
#menubtn.open span:nth-child(2){opacity:0;transform:scaleX(0)}
#menubtn.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

#menuOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,20,20,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s ease}
#menuOverlay.open{opacity:1;pointer-events:auto}
#mpanelWrap{position:fixed;top:0;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:31;display:flex;justify-content:flex-end;pointer-events:none}
#mpanel{position:relative;width:min(320px,88vw);height:100%;background:var(--card);padding:0 16px 16px;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain;box-shadow:-6px 0 24px rgba(0,0,0,.15);opacity:0;transform:scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .15s ease,transform .15s ease}
#mpanel.open{opacity:1;transform:scale(1);pointer-events:auto}
.mtitle{display:flex;align-items:center;gap:8px;margin:0;position:sticky;top:0;padding:16px 0 8px;background:var(--card);z-index:1}
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0;color:var(--accent);background:none;border:none;cursor:pointer;padding:0}
.info-btn svg{width:14px;height:14px;display:block;pointer-events:none}
.info-btn:active{color:var(--txt);transform:scale(0.9)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal .box{position:relative;background:var(--card);border-radius:16px;padding:18px 24px 24px;max-width:320px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.modal h2{font-size:17px;font-weight:800;color:var(--txt);margin:0 0 18px}
.mclose{position:absolute;top:10px;right:10px;width:28px;height:28px;background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.mclose span{position:absolute;width:14px;height:2px;border-radius:1px;background:var(--accent)}
.mclose span:nth-child(1){transform:rotate(45deg)}
.mclose span:nth-child(2){transform:rotate(-45deg)}
#infoBody{font-size:15px;color:var(--txt);line-height:1.6;text-align:left;margin:0}
#infoBody .ibrow{display:flex;margin-top:8px}
#infoBody .ibrow:first-child{margin-top:0}
#infoBody .idash{flex-shrink:0;width:13px}

.mtitle img{width:22px;height:22px;object-fit:contain}
.mthemecard{display:none;border:1px solid var(--border);border-radius:8px;padding:6px}
.mthemecard.show{display:block}
.mtc-top{display:flex;align-items:center;gap:8px}
.mtc-top img{display:block;image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges}
.mtc-info{flex:1;min-width:0}
.mtc-title{font-size:15px;font-weight:700;color:var(--txt)}
.mtc-title .mtc-no{color:var(--accent);margin-right:2px}
.mtc-desc{font-size:15px;font-weight:700;color:var(--txt)}
.mtc-reset{width:100%;height:36px;margin-top:8px;border:none;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.mthemecard+.msection{margin-top:8px}
.mtitle span{font-size:15px;font-weight:800}
.mgreet{display:none;font-size:12.5px;font-weight:600;color:var(--accent);text-align:left;margin-top:36px}
.mgreet.show{display:block}
.mfooter{padding-top:8px;display:flex;gap:8px}
.mbig{flex:1;text-align:center;background:var(--border);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.mbig#loginBtn,.mbig[href*="/pokelab"]{height:36px;box-sizing:border-box;padding:0 10px}

.msection{margin-top:24px}
.mtitle + .msection{margin-top:8px}
.msectitle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;color:var(--txt);padding:0}
.msectitle .mdivider{flex:1;height:1px;background:var(--border)}
.msubgroup{margin:12px 0 0}
.msublabel{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:7px}
.mtoggles{display:flex;flex-wrap:wrap;gap:6px}
.mtoggles.disabled-group{opacity:.35}
.mtoggle{padding:0 12px;height:28px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--border);background:var(--border);color:var(--txt);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.mtoggle.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mtoggle:disabled,.disabled-group .mtoggle{pointer-events:none}

@media (hover:hover) and (pointer:fine){
  html{scrollbar-gutter:stable}
  #mpanel{scrollbar-gutter:stable}
  html,#mpanel{scrollbar-width:thin}
  html::-webkit-scrollbar-track,#mpanel::-webkit-scrollbar-track{background:transparent}
  html::-webkit-scrollbar-thumb,#mpanel::-webkit-scrollbar-thumb{background:transparent;border-radius:6px;transition:background .25s}
  html.scrolling::-webkit-scrollbar-thumb,#mpanel.scrolling::-webkit-scrollbar-thumb{background:rgba(0,0,0,.28)}
  html.scrolling::-webkit-scrollbar-thumb:hover,#mpanel.scrolling::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.42)}
  html,#mpanel{scrollbar-color:transparent transparent}
  html.scrolling,#mpanel.scrolling{scrollbar-color:rgba(0,0,0,.28) transparent}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="brushIcon" viewBox="0 0 20 20">
      <mask id="brushMask" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
        <rect width="20" height="20" fill="#fff"/>
        <g transform="translate(-1.45 1.45) rotate(45 10 10) translate(10 10) scale(1.25) translate(-10 -10)" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round">
          <path d="M5.9 8.3 5.5 3.6h9l-.4 4.7z"/>
          <path d="M5.3 10.4h9.4v1.6H5.3z"/>
          <path d="M8.6 12v3.4a1.4 1.4 0 0 0 2.8 0V12z"/>
          <path d="M8 2.6 9 2.6 8.5 6.4z" fill="#fff" stroke="none"/>
          <path d="M11 2.6 12 2.6 11.5 6.4z" fill="#fff" stroke="none"/>
          <circle cx="10" cy="15.7" r="0.6" fill="#fff" stroke="none"/>
        </g>
      </mask>
      <rect width="20" height="20" rx="5" mask="url(#brushMask)" style="fill:var(--accent)"/>
    </symbol>
  </defs>
</svg>
<div class="wrap">
  <header>
    <div class="title"><img id="hlogo" src="favicon-192.png" alt="ball"><h1 id="htitle">Palette de Pokémon</h1></div>
    <div class="searchwrap" id="searchWrapBox">
      <div class="searchRow">
        <span class="searchIcon"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input id="q" class="search" type="text" autocomplete="off">
        <button id="qclear" class="qclear" type="button" aria-label="검색어 지우기"><svg viewBox="0 0 24 24"><path d="M6 6L18 18M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div class="stripwrap" id="stripwrap">
      <button class="stripArrow left" id="stripArrowL" type="button" aria-label="이전"><svg viewBox="0 0 10 16"><polygon points="9,1 1,8 9,15"></polygon></svg></button>
      <div class="stripClip" id="stripClip"><div class="strip" id="strip"></div></div>
      <button class="stripArrow right" id="stripArrowR" type="button" aria-label="다음"><svg viewBox="0 0 10 16"><polygon points="1,1 9,8 1,15"></polygon></svg></button>
    </div>
  </header>

  <div class="plist" id="mainList"></div>
  <div class="empty" id="emptyMsg" style="display:none">검색 결과가 없습니다.</div>
  <div class="plist" id="quizArea" style="display:none"></div>

var DEX=[];
var FORMS=FORMSDEX;
function buildBaseDex(forms){
  var keys=Object.keys(forms).map(function(k){return parseInt(k,10)}).sort(function(a,b){return a-b});
  return keys.map(function(dex){
    var base=forms[dex][0];
    return {dex:dex,name:base.name,category:base.category,height:base.height,weight:base.weight,types:base.types,img:base.img,top3:base.top3,top6:base.top6};
  });
}
var q='';
var expandOpenDex=null;
var CUR_PALCOUNT=3;

function pad4(n){return String(n).padStart(4,'0')}

function typeBadge(t){
  var bg=TYPE_COLORS[t]||'#999';
  return '<span class="typebadge" style="background:'+bg+'">'+t+'</span>';
}

function contrastColor(hex){
  var h=(hex||'#999999').replace('#','');
  if(h.length===3){h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]}
  var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  var yiq=(r*299+g*587+b*114)/1000;
  return yiq>=140?'#000000':'#ffffff';
}
function swatchCell(c){
  if(!c)return '<div class="swatchbar empty"></div>';
  return '<div class="swatchbar" style="background:'+c.hex+';color:'+contrastColor(c.hex)+'">'+c.hex.toUpperCase()+'</div>';
}
function paletteHTML(top3,top6){
  if(CUR_PALCOUNT>=6){
    var c6=(top6&&top6.length?top6:top3)||[];
    var rows=[0,1,2].map(function(i){
      return '<div class="paletterow">'+swatchCell(c6[i])+swatchCell(c6[i+3])+'</div>';
    });
    return '<div class="palette pal6">'+rows.join('')+'</div>';
  }
  return '<div class="palette">'+(top3||[]).map(swatchCell).join('')+'</div>';
}

function rowContentHTML(p){
  return '<div class="ptop"><span class="pno">No.'+pad4(p.dex)+'</span><span class="pname">'+p.name+'</span></div>'
    +'<div class="pbody">'
      +'<div class="pleft"><img loading="lazy" src="'+p.img+'" alt="'+p.name+'" onerror="this.style.opacity=.2"></div>'
      +'<div class="pright">'
        +'<div class="typebadges">'+(p.types||[]).map(typeBadge).join('')+'</div>'
        +'<div class="pr-line"><span class="v">'+(p.category||'')+'</span></div>'
        +'<div class="pr-line pr-hw"><span class="hcol"><span class="k">키</span><span class="v">'+(p.height||'')+'</span></span><span class="hcol"><span class="k">몸무게</span><span class="v">'+(p.weight||'')+'</span></span></div>'
        +paletteHTML(p.top3,p.top6)
      +'</div>'
    +'</div>';
}

function toRowData(dex,f){
  return {dex:dex,name:f.name,category:f.category,height:f.height,weight:f.weight,types:f.types,img:f.img,top3:f.top3,top6:f.top6};
}

function getStripSpacer(){
  var strip=$('strip');
  var sp=document.getElementById('stripLeftSpacer');
  if(!sp){
    sp=document.createElement('div');
    sp.id='stripLeftSpacer';
    sp.style.cssText='flex:0 0 auto;width:0px;align-self:stretch;transition:width .28s ease';
    strip.insertBefore(sp,strip.firstChild);
  }
  return sp;
}
// 서브벨트가 아이콘 왼쪽으로 필요한 만큼 실제 스크롤 가능한 여백을 확보한다.
// (검색 필터 등으로 앞에 다른 포켓몬 칸이 없을 때, translateX만으로는 왼쪽으로
//  스크롤해서 볼 수 없는 문제를 막기 위해 진짜 레이아웃 공간을 만들어준다.)
function ensureExpandRoom(col,idx,stepW){
  var strip=$('strip');
  var sp=getStripSpacer();
  var prevExtra=parseFloat(sp.style.width)||0;
  var natural=col.offsetLeft-prevExtra;
  var needed=idx*stepW;
  var newExtra=Math.max(0,needed-natural);
  var delta=newExtra-prevExtra;
  if(delta!==0){
    sp.style.width=newExtra+'px';
    animateScrollBy(strip,delta,280);
  }
}
function closeExpand(){
  var ex=document.getElementById('stripExpand');
  if(ex)ex.remove();
  expandOpenDex=null;
  var strip=$('strip');
  if(strip)strip.querySelectorAll('.sitm.active').forEach(function(el){el.classList.remove('active')});
  var sp=document.getElementById('stripLeftSpacer');
  if(sp){
    var prevExtra=parseFloat(sp.style.width)||0;
    if(prevExtra>0&&strip)animateScrollBy(strip,-prevExtra,280);
    sp.style.width='0px';
  }
  syncArrowHeight();
}

function openExpand(dex,iconEl){
  closeExpand();
  var forms=FORMS[dex];
  if(!forms||forms.length<2)return;
  var col=iconEl.closest('.sitmCol');
  if(!col)return;
  var row=document.querySelector('.prow[data-dex="'+dex+'"]');
  var curIdx=row?parseInt(row.dataset.formIdx||'0',10):0;
  if(!(curIdx>=0&&curIdx<forms.length))curIdx=0;
  var ex=document.createElement('div');
  ex.id='stripExpand';
  ex.className='stripExpand';
  ex.innerHTML=forms.map(function(f,i){
    return '<div class="sitm'+(i===curIdx?' base-mark':'')+'" data-dex="'+dex+'" data-idx="'+i+'"><div class="sitmImgWrap"><img class="simg" loading="lazy" src="'+f.img+'" alt="" onerror="this.style.opacity=.2"></div></div>';
  }).join('');
  col.appendChild(ex);
  expandOpenDex=String(dex);
  iconEl.classList.add('active');

  // 순서는 원래 그대로 두고, 선택된 폼이 아이콘 바로 아래(가로 0 위치)에 오도록
  // 벨트 컨테이너 자체를 -curIdx*stepW 만큼 이동시켜 정렬만 맞춘다.
  var items=ex.querySelectorAll('.sitm');
  var stepW=items.length>1?(items[1].offsetLeft-items[0].offsetLeft):0;
  ensureExpandRoom(col,curIdx,stepW);
  ex.style.transform='translateX('+(-curIdx*stepW)+'px)';

  // 현재 선택된 폼이 먼저 나타나고, 나머지는 그 자리에서 시작해 좌우 제자리로 퍼진다.
  items.forEach(function(el,i){
    if(i===curIdx)return;
    var delta=(i-curIdx)*stepW;
    el.style.transform='translateX('+(-delta)+'px)';
  });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      ex.classList.add('show');
      items.forEach(function(el,i){if(i!==curIdx)el.style.transform=''});
    });
  });

  items.forEach(function(el){
    el.onclick=function(e){
      e.stopPropagation();
      var d=el.dataset.dex,idx=parseInt(el.dataset.idx,10);
      selectForm(d,idx);
    };
  });
  syncArrowHeight();
}

// 서브벨트(폼 펼침)가 열려있는 상태에서 폼이 바뀌면, 순서는 그대로 두고
// 선택된 카드가 아이콘 바로 아래로 오도록 벨트 전체를 옆으로 슬라이드시킨다.
function slideExpand(dex,nextIdx){
  var ex=document.getElementById('stripExpand');
  if(!ex||expandOpenDex!==String(dex))return;
  var items=ex.querySelectorAll('.sitm');
  if(items.length<2)return;
  var stepW=items[1].offsetLeft-items[0].offsetLeft;
  var col=ex.closest('.sitmCol');
  if(col)ensureExpandRoom(col,nextIdx,stepW);
  items.forEach(function(el){
    el.classList.toggle('base-mark',parseInt(el.dataset.idx,10)===nextIdx);
  });
  ex.style.transition='transform .28s ease';
  ex.style.transform='translateX('+(-nextIdx*stepW)+'px)';
}

function selectForm(dex,idx){
  var row=document.querySelector('.prow[data-dex="'+dex+'"]');
  if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'center'});
  var forms=FORMS[dex];
  if(!forms)return;
  var cur=parseInt(row.dataset.formIdx||'0',10);
  if(cur===idx)return;
  var dir=idx>cur?1:-1;
  swipeToForm(row,forms,cur,idx,dir);
}

function updateStripIcon(dex,forms,curIdx,nextIdx,dir){
  if(curIdx===nextIdx)return;
  var icon=document.querySelector('#strip .sitm[data-dex="'+dex+'"]');
  if(!icon)return;
  var wrap=icon.querySelector('.sitmImgWrap');
  if(!wrap)return;

  // 지나치는 폼까지 순서대로 보여주기 위한 인덱스 시퀀스 (curIdx -> nextIdx)
  var seq=[];
  if(dir>=0){
    if(nextIdx>=curIdx){for(var i=curIdx;i<=nextIdx;i++)seq.push(i);}
    else{seq=[curIdx,nextIdx];}
  }else{
    if(nextIdx<=curIdx){for(var i=curIdx;i>=nextIdx;i--)seq.push(i);}
    else{seq=[curIdx,nextIdx];}
  }
  var n=seq.length;
  // 화면상 왼쪽->오른쪽 나열 순서. dir>=0이면 오른쪽에서 등장하며 왼쪽으로 이동(정방향),
  // dir<0이면 왼쪽에서 등장하며 오른쪽으로 이동(역방향)하는 슬롯머신 느낌을 준다.
  var screenSeq=dir>=0?seq:seq.slice().reverse();
  var startPct=dir>=0?0:-((n-1)/n*100);
  var endPct=dir>=0?-((n-1)/n*100):0;

  wrap.innerHTML='';
  var reel=document.createElement('div');
  reel.style.position='absolute';reel.style.top='0';reel.style.left='0';
  reel.style.height='100%';reel.style.display='flex';
  reel.style.width=(n*100)+'%';
  reel.style.transform='translateX('+startPct+'%)';
  screenSeq.forEach(function(i){
    var im=document.createElement('img');
    im.loading='lazy';
    im.alt='';
    im.onerror=function(){this.style.opacity=.2};
    im.src=forms[i].img;
    im.style.position='static';
    im.style.flex='0 0 '+(100/n)+'%';
    im.style.width=(100/n)+'%';
    im.style.height='100%';
    im.style.objectFit='contain';
    im.style.display='block';
    reel.appendChild(im);
  });
  wrap.appendChild(reel);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      reel.style.transition='transform .32s ease';
      reel.style.transform='translateX('+endPct+'%)';
    });
  });
  setTimeout(function(){
    wrap.innerHTML='';
    var finalImg=document.createElement('img');
    finalImg.className='simg';
    finalImg.loading='lazy';
    finalImg.alt='';
    finalImg.onerror=function(){this.style.opacity=.2};
    finalImg.src=forms[nextIdx].img;

function swipeToForm(row,forms,curIdx,nextIdx,dir){
  updateStripIcon(row.dataset.dex,forms,curIdx,nextIdx,dir);
  slideExpand(row.dataset.dex,nextIdx);
  var pinner=row.querySelector('.pinner');
  var oldC=pinner.querySelector('.pcontent');
  if(!oldC)return;
  var h=oldC.offsetHeight;
  pinner.style.height=h+'px';
  oldC.style.position='absolute';oldC.style.top='0';oldC.style.left='0';oldC.style.width='100%';
  oldC.style.transition='transform .28s ease';
  var newC=document.createElement('div');
  newC.className='pcontent';
  newC.innerHTML=rowContentHTML(toRowData(row.dataset.dex,forms[nextIdx]));
  newC.style.position='absolute';newC.style.top='0';newC.style.left='0';newC.style.width='100%';
  newC.style.transform='translateX('+(dir*100)+'%)';
  pinner.appendChild(newC);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      oldC.style.transform='translateX('+(dir*-100)+'%)';
      newC.style.transition='transform .28s ease';
      newC.style.transform='translateX(0)';
    });
  });
  setTimeout(function(){
    if(oldC.parentNode)oldC.parentNode.removeChild(oldC);
    newC.style.position='';newC.style.top='';newC.style.left='';newC.style.width='';newC.style.transition='';newC.style.transform='';
    pinner.style.height='';
    row.dataset.formIdx=String(nextIdx);
  },300);
}

function attachSwipeHandlers(){
  document.querySelectorAll('.prow[data-multi="1"]').forEach(function(row){
    var startX=null,startY=null,dragging=false,pid=null;
    row.addEventListener('pointerdown',function(e){
      if(e.target.closest&&e.target.closest('.brushbtn'))return;
      startX=e.clientX;startY=e.clientY;dragging=true;pid=e.pointerId;
      try{row.setPointerCapture(pid)}catch(err){}
    });
    row.addEventListener('pointerup',function(e){
      if(!dragging)return;dragging=false;
      try{if(pid!==null)row.releasePointerCapture(pid)}catch(err){}
      var dx=e.clientX-startX,dy=e.clientY-startY;
      if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){
        var dex=row.dataset.dex;
        var forms=FORMS[dex];
        if(!forms||forms.length<2)return;
        var cur=parseInt(row.dataset.formIdx||'0',10);
        var next;
        if(dx<0){next=(cur+1)%forms.length;}else{next=(cur-1+forms.length)%forms.length;}
        swipeToForm(row,forms,cur,next,dx<0?1:-1);
      }
    });
    row.addEventListener('pointercancel',function(){
      dragging=false;
      try{if(pid!==null)row.releasePointerCapture(pid)}catch(err){}
    });
  });
}

function animateScrollBy(el,delta,duration){
  duration=duration||280;
  var start=el.scrollLeft,startTime=null;
  // CSS scroll-behavior:smooth가 켜져있으면 매 프레임 scrollLeft 대입이
  // 각각 스무스 스크롤로 처리되면서 실제로는 거의 못 움직이는 문제가 있어
  // 애니메이션 도중엔 강제로 auto로 바꿔준다.
  var prevBehavior=el.style.scrollBehavior;
  el.style.scrollBehavior='auto';
  function step(ts){
    if(startTime===null)startTime=ts;
    var t=Math.min((ts-startTime)/duration,1);
    var ease=1-Math.pow(1-t,3);
    el.scrollLeft=start+delta*ease;
    if(t<1){requestAnimationFrame(step);}
    else{el.style.scrollBehavior=prevBehavior;}
  }
  requestAnimationFrame(step);
}
function stripStep(){
  var cols=Array.prototype.filter.call(document.querySelectorAll('#strip>.sitmCol'),function(c){return c.offsetParent!==null});

}
function bindArrowHold(btn,dir){
  var holdTimer=null,rafId=null,holding=false,engaged=false,lastTs=null,holdStartTs=null;
  var HOLD_DELAY=300,SPEED=130,MAX_SPEED=260,RAMP_MS=1000; // SPEED: px/s, 누르고 있으면 RAMP_MS 동안 MAX_SPEED(2배)까지 서서히 빨라짐
  function frame(ts){
    if(!holding)return;
    if(lastTs===null){lastTs=ts;holdStartTs=ts;}
    var dt=ts-lastTs;lastTs=ts;
    var elapsed=ts-holdStartTs;
    var speed=elapsed>=RAMP_MS?MAX_SPEED:SPEED+(MAX_SPEED-SPEED)*(elapsed/RAMP_MS);
    $('strip').scrollLeft+=dir*speed*(dt/1000);
    rafId=requestAnimationFrame(frame);
  }
  function startHold(){
    holding=true;engaged=true;lastTs=null;holdStartTs=null;
    $('strip').style.scrollBehavior='auto';
    rafId=requestAnimationFrame(frame);
  }
  function stopHold(){
    holding=false;
    if(rafId)cancelAnimationFrame(rafId);
    rafId=null;
    $('strip').style.scrollBehavior='';
  }
  btn.addEventListener('pointerdown',function(e){
    engaged=false;
    clearTimeout(holdTimer);
    holdTimer=setTimeout(startHold,HOLD_DELAY);
  });
  function release(){
    clearTimeout(holdTimer);
    if(holding){stopHold();}
    else if(!engaged){animateScrollBy($('strip'),dir*stripStep(),360);}
  }
  btn.addEventListener('pointerup',release);
  btn.addEventListener('pointerleave',function(){clearTimeout(holdTimer);if(holding)stopHold();});
  btn.addEventListener('pointercancel',function(){clearTimeout(holdTimer);if(holding)stopHold();});
}

// ---- 붓 버튼: 포켓몬 대표 3색으로 사이트 색(진한색=강조, 중간=테두리, 옅은색=배경) 바꾸기 ----
var DEFAULT_THEME={bg:'#f2f2f2',border:'#d1d1d1',accent:'#6e6e6e'};
var CARD_HEX='#ffffff',TXT_HEX='#1a1a1a';
var ACTIVE_THEME_KEY=null;
function hexToRgb(h){
  h=String(h||'').replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.substr(0,2),16)||0,parseInt(h.substr(2,2),16)||0,parseInt(h.substr(4,2),16)||0];
}
function relLum(hex){
  var c=hexToRgb(hex).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
}
function contrastRatio(a,b){
  var la=relLum(a),lb=relLum(b);
  return (Math.max(la,lb)+0.05)/(Math.min(la,lb)+0.05);
}
function mixHex(a,b,r){
  var x=hexToRgb(a),y=hexToRgb(b);
  return '#'+[0,1,2].map(function(i){
    var v=Math.round(x[i]*(1-r)+y[i]*r);
    return (v<16?'0':'')+v.toString(16);
  }).join('');
}
// 강조색 위 글씨: 흰색 <-> 검정 자동 선택
function onColorFor(hex){
  return contrastRatio(hex,CARD_HEX)>=contrastRatio(hex,TXT_HEX)?CARD_HEX:TXT_HEX;
}
function themeFromTop3(top3){
  var cols=(top3||[]).map(function(c){return c&&c.hex}).filter(Boolean);
  if(!cols.length)return null;
  cols.sort(function(a,b){return relLum(a)-relLum(b)});
  var t={accent:cols[0],border:DEFAULT_THEME.border,bg:DEFAULT_THEME.bg};
  if(cols.length>1)t.bg=cols[cols.length-1];
  if(cols.length>2)t.border=cols[1];
  // 글씨가 잘 보이는 게 우선: 배경이 너무 어두우면 검정 글씨가 읽힐 때까지 흰색 쪽으로 살짝 밝힘
  var bg0=t.bg;
  for(var r=0.05;r<=1&&contrastRatio(TXT_HEX,t.bg)<4.5;r+=0.05)t.bg=mixHex(bg0,CARD_HEX,r);
  // 강조색이 글씨로 쓰일 때 카드/배경 위에서 안 보이면 잘 보일 때까지 검정 쪽으로 살짝 어둡게
  var ac0=t.accent;
  for(var q2=0.05;q2<=1&&(contrastRatio(t.accent,CARD_HEX)<3||contrastRatio(t.accent,t.bg)<3);q2+=0.05)t.accent=mixHex(ac0,TXT_HEX,q2);
  return t;
}
function applyTheme(t){
  var st=document.documentElement.style;
  if(!t){
    ['--bg','--border','--accent','--on-accent'].forEach(function(k){st.removeProperty(k)});
    return;
  }
  st.setProperty('--bg',t.bg);
  st.setProperty('--border',t.border);
  st.setProperty('--accent',t.accent);
  st.setProperty('--on-accent',onColorFor(t.accent));
}

var QP_SLOT_H=46;
function quizColor6(f){
  var src=(f.top6&&f.top6.length?f.top6:f.top3)||[];
  var out=src.slice(0,6);
  while(out.length&&out.length<6)out.push(out[out.length-1]);

}
function quizPaletteHTML(f){
  var c6=quizColor6(f);
  var slots=[0,1,2].map(function(i){
    var top=c6[i]||{hex:'#999999'};
    var bot=c6[i+3]||{hex:'#999999'};
    return '<div class="qpslot">'
      +'<div class="qpbar" id="qpTop'+i+'" style="background:'+top.hex+';color:'+contrastColor(top.hex)+';height:'+QP_SLOT_H+'px"><span class="qphex">'+top.hex.toUpperCase()+'</span></div>'
      +'<div class="qpbar" id="qpBot'+i+'" style="background:'+bot.hex+';color:'+contrastColor(bot.hex)+';height:0px;opacity:0"><span class="qphex">'+bot.hex.toUpperCase()+'</span></div>'
    +'</div>';
  }).join('');
  return '<div class="quizpalstack" id="quizPalStack">'
    +'<div class="qpalette" id="qPalette">'+slots+'</div>'
    +'<div class="quizmosaic" id="quizMosaic"></div>'
  +'</div>';
}
function qpAllocateRatioHeights(ratios,totalHeight,minH){
  var n=ratios.length;
  var sum=ratios.reduce(function(a,b){return a+b},0)||1;
  var raw=ratios.map(function(r){return totalHeight*r/sum});
  for(var iter=0;iter<6;iter++){
    var deficit=0,aboveSum=0,above=[];
    for(var i=0;i<n;i++){
      if(raw[i]<minH){deficit+=(minH-raw[i]);above[i]=false;}
      else{aboveSum+=raw[i];above[i]=true;}
    }
    if(deficit<=0.01||aboveSum<=0)break;
    for(var i=0;i<n;i++){
      raw[i]=above[i]?(raw[i]-deficit*(raw[i]/aboveSum)):minH;
    }
  }
  return raw;
}
function buildQuizMosaic(container,f){
  var c6=quizColor6(f);
  var mz=f.mz||'';
  var html='';
  for(var idx=0;idx<mz.length;idx++){
    var ch=mz[idx];
    if(ch==='.'){
      html+='<div class="qmcell" style="background:transparent"></div>';
    }else{
      var ci=parseInt(ch,10);
      var hex=(c6[ci]&&c6[ci].hex)||'#999999';
      html+='<div class="qmcell" style="background:'+hex+'"></div>';
    }
  }
  container.innerHTML=html;
}
function applyQuizPaletteStage(f,level){
  if(level===1){
    for(var i=0;i<3;i++){
      var top=$('qpTop'+i),bot=$('qpBot'+i);
      if(top)top.style.height=(QP_SLOT_H/2)+'px';
      if(bot){bot.style.height=(QP_SLOT_H/2)+'px';bot.style.opacity='1';}
    }
  }else if(level===2){
    var c6=quizColor6(f);
    var ratios=c6.map(function(c){return c.ratio||0.01});
    var heights=qpAllocateRatioHeights(ratios,QP_SLOT_H*3,15);
    for(var i=0;i<3;i++){
      var top=$('qpTop'+i),bot=$('qpBot'+i);
      if(top)top.style.height=heights[i]+'px';
      if(bot)bot.style.height=heights[i+3]+'px';
    }
  }else if(level===3){
    var pal=$('qPalette');
    if(pal)pal.classList.add('gone');
    setTimeout(function(){
      if(pal)pal.style.display='none';
      var mosaic=$('quizMosaic');
      if(!mosaic)return;
      buildQuizMosaic(mosaic,f);
      mosaic.classList.add('show');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          mosaic.classList.add('in');
        });
      });
    },420);
  }
}
function renderQuizQuestion(){
  var area=$('quizArea');
  var f=quizCurrent.form;
  var region=quizRegionForForm(quizCurrent.dex,f);
  var desc=quizRegionPhrase(region)+'에서 처음 발견된 '+quizTypesText(f.types)+' 포켓몬';
  area.innerHTML=
    '<div class="prow quizrow">'
      +'<span class="pquizmark quizpawbadge hint0" id="quizPawBadge">'+PAW_SVG+'</span>'
      +'<div class="pinner">'
        +'<div class="pcontent quizcontent">'
          +'<div class="ptop quiztop"><span class="pname">아래 컬러 팔레트의 주인공을 맞혀보세요</span></div>'
          +'<div class="pbody">'
            +'<div class="pleft quizleft">'+quizPaletteHTML(f)+'</div>'
            +'<div class="pright">'
              +'<div class="pr-line quizdesc">'+desc+'</div>'
              +'<div class="quizhintline" id="quizHintLine"></div>'
            +'</div>'
          +'</div>'
          +'<div class="quizanswer-row">'
            +'<div class="quizinput-wrap"><input type="text" id="quizAnswerInput" autocomplete="off" placeholder="포켓몬 이름"><button type="button" id="quizClearBtn" aria-label="지우기"><svg viewBox="0 0 24 24"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button></div>'
            +'<button type="button" id="quizHintBtn" class="quizhintbtn">힌트 추가</button>'
          +'</div>'
          +'<div class="quizfeedback" id="quizFeedback"></div>'
        +'</div>'
      +'</div>'
    +'</div>';
  area.style.display='block';
  $('quizAnswerInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkQuizAnswer();});
  $('quizClearBtn').onclick=function(){$('quizAnswerInput').value='';$('quizAnswerInput').focus();};
  $('quizHintBtn').onclick=applyQuizHint;
  $('quizAnswerInput').focus();
}

function applyQuizHint(){
  if(quizHintLevel>=3)return;
  quizHintLevel++;
  var badge=$('quizPawBadge');
  badge.classList.remove('hint0','hint1','hint2','hint3');
  badge.classList.add('hint'+quizHintLevel);
  var f=quizCurrent.form;
  var line=$('quizHintLine');
  var msgs=[];
  if(quizHintLevel>=1)msgs.push('분류: '+(f.category||'?'));
  if(quizHintLevel>=2)msgs.push('이름 길이: '+quizBaseName(f).length+'글자');
  if(quizHintLevel>=3)msgs.push('첫 글자: '+quizBaseName(f).charAt(0));
  line.textContent='힌트 - '+msgs.join(' / ');
  if(quizHintLevel>=3)$('quizHintBtn').disabled=true;
  applyQuizPaletteStage(f,quizHintLevel);
}

function checkQuizAnswer(){
  var input=$('quizAnswerInput');
  var val=(input.value||'').trim();
  if(!val)return;
  var f=quizCurrent.form;
  var answer=quizBaseName(f);
  var fb=$('quizFeedback');
  if(val===answer){
    fb.textContent='정답! '+f.name;
    fb.className='quizfeedback correct';
    var mark=document.querySelector('.prow[data-dex="'+quizCurrent.dex+'"] .pquizmark');
    if(mark)mark.classList.add('solved');
    setTimeout(pickQuizQuestion,900);
  }else{
    fb.textContent='다시 시도해봐';
    fb.className='quizfeedback wrong';
  }
}
